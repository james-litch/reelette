name: Supabase production migrations

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply pending migrations (leave unchecked to preview only)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# Finish an in-flight migration before starting another deployment.
concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Production migrations
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Preview and optionally apply migrations
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPLY_MIGRATIONS: ${{ inputs.apply }}
        run: |
          : "${SUPABASE_PROJECT_REF:?Set the production environment variable SUPABASE_PROJECT_REF}"
          : "${SUPABASE_ACCESS_TOKEN:?Set the production environment secret SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_DB_PASSWORD:?Set the production environment secret SUPABASE_DB_PASSWORD}"
          npx supabase migration list --remote="$SUPABASE_PROJECT_REF"
          # The initial rooms migration predates the imported remote schema.
          # Include pending older versions as well as newer migrations.
          npx supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --include-all --dry-run
          if [ "$APPLY_MIGRATIONS" = "true" ]; then
            npx supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --include-all --yes
          fi
